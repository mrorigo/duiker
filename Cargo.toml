[package]
name = "duiker"
version = "0.1.0"
edition = "2021"
description = "A fast, honest disk usage analyzer for the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrorigo/duiker"
readme = "README.md"
keywords = ["disk", "disk-usage", "analyzer", "tui", "du"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
crossbeam = "0.8"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
humansize = "2.1"
clap = { version = "4.0", features = ["derive"] }
ignore = "0.4"
num_cpus = "1.16"
thiserror = "1.0"
ratatui = "0.30.2"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.3"

[[bench]]
name = "scanner_bench"
harness = false
